<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean and Rumble Kick with Tone.js</title>
<script src="http://unpkg.com/tone"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="./style.css">

</head>
<body style="background:black; color:white; font-family:sans-serif; text-align:center; padding:40px;">
  
  
  <h1 class="text-success">Clean and Rumble Kick Generator</h1>

  <p id="play-running" class="running text-success fs-3">Playing...</p>
  <p id="stop-running" class="stop text-danger fs-3">Stop</p>


  <div class="card mx-auto mt-5 bg-light">
  <button class="col-sm-6 col-lg-3 mx-auto my-5 btn btn-dark" id="startBtn">Start</button>
  <button class="col-sm-6 col-lg-3 mx-auto my-5 btn btn-dark" id="stopBtn">Stop</button>
  </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="./script.js"></script>
</body>
</html>
